server {
    listen 80;
    server_name _;
    client_max_body_size 2g;

    # Веб-интерфейс менеджера
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Раздача RPM-зеркал клиентам dnf/yum
    # baseurl=http://СЕРВЕР/repo/rpm/OL10_BaseOS
    location /repo/rpm/ {
        alias /var/lib/repo-manager/mirrors/rpm/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /repo/deb/ {
        alias /var/lib/repo-manager/public/;
        autoindex on;
    }

    location /repo/local/ {
        alias /var/lib/repo-manager/local/;
        autoindex on;
    }
}
