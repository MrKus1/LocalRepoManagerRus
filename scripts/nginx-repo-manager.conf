server {
    listen 80;
    server_name _;
    client_max_body_size 2g;

    charset utf-8;

    # API только из локальной сети. Пакеты в /repo/ остаются открытыми.
    location /api/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        client_max_body_size 2g;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Веб-интерфейс. Приложение слушает только 127.0.0.1:8000.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Раздача RPM-зеркал клиентам dnf/yum
    # baseurl=http://СЕРВЕР/repo/rpm/OL10_BaseOS
    location /repo/rpm/ {
        alias /var/lib/repo-manager/mirrors/rpm/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /repo/deb/ {
        alias /var/lib/repo-manager/public/;
        autoindex on;
    }

    location /cache/ {
        proxy_pass http://127.0.0.1:8000/cache/;
        proxy_set_header Host $host;
    }

    location /repo/local/ {
        alias /var/lib/repo-manager/local/;
        autoindex on;
    }
}
